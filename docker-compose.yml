services:
  influxdb:
    image: docker.io/library/influxdb:2.7
    container_name: influxdb-energia
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
      - ./data/influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}

  collector:
    build: ./collector
    container_name: energia-collector
    restart: unless-stopped
    depends_on:
      - influxdb
    env_file: .env
    environment:
      # in rete bridge 127.0.0.1 è il container stesso: InfluxDB si raggiunge per nome
      # del servizio, Home Assistant (rete host) tramite host.containers.internal,
      # che Podman aggiunge da solo in /etc/hosts
      INFLUX_URL: http://influxdb:8086
      HA_URL: http://host.containers.internal:8123
      WEB_PORT: "8090"   # porta interna fissa; quella pubblicata si cambia con WEB_PORT nel .env
    ports:
      - "${WEB_PORT:-8090}:8090"   # interfaccia web su http://<host>:8090
    volumes:
      - ./data/app:/data   # metadati sensori (nomi, prezzo)
